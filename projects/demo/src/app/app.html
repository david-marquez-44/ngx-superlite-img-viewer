<h1>Hola mundo</h1>
<div style="display: flex; height: 100%; width: 100%; align-items: center; justify-content: center;">

  <div style="display: grid; grid-template-columns: repeat(3, 1fr); grid-gap: 10px;">
    @for (image of testImgs; track $index; let index = $index) {
      <img [src]="image" [alt]="index" (click)="openViewer(index)">
    }
  </div>

  <ngx-superlite-img-viewer [images]="testImgs" [imageIndex]="indexImg()" [class.hidden-element]="isCloseViewer()"></ngx-superlite-img-viewer>

</div>
