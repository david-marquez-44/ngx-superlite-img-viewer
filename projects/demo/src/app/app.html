<main class="apple-demo">
  <header class="hero">
    <div class="hero__content">
      <h1>
        Demo
        <span>ngx-superlite-img-viewer</span>
      </h1>
      <p class="subtitle">
        Ligero, fluido y pensado para destacar cada imagen sin distracciones.
      </p>
      <div class="hero__actions">
        <a class="cta cta--primary" href="#gallery" (click)="goToGallery($event)">Ver galeria</a>
      </div>
    </div>

    <div class="hero__visual" aria-label="Logo superlite">
      <div class="glass-panel">
        <img src="/images/logo_superlite.svg" alt="Logo superlite">
      </div>
    </div>
  </header>

  <section id="gallery" class="gallery" aria-label="Image gallery preview">
    <div class="gallery__header">
      <p>Galeria</p>
      <span>{{ imgArray.length }} imagenes</span>
    </div>

    <div class="gallery__grid">
      @for (image of imgArray; track $index; let index = $index) {
        <figure class="gallery__item" (click)="openViewer(index)" [attr.aria-label]="'Open image ' + (index + 1)">
          <img [src]="image" [alt]="'Sample image ' + (index + 1)" [title]="'#' + (index + 1)" />
          <figcaption>#{{ index + 1 }}</figcaption>
        </figure>
      }
    </div>
  </section>

  @if (isOpenViewer()) {
    <ngx-superlite-img-viewer [images]="imgArray" [imageIndex]="indexImg()" (closed)="closeViewer()"></ngx-superlite-img-viewer>
  }
</main>
