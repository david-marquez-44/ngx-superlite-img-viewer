<div class="superlite-viewer">
  <button type="button" (click)="previous()" class="superlite-viewer__navigate-btn">
    <ngx-sliv-icon iconName="previous"></ngx-sliv-icon>
  </button>
  <img class="superlite-viewer__img" [src]="images()[currentIndexIntern()]" alt="">
  <button type="button" (click)="next()" class="superlite-viewer__navigate-btn">
    <ngx-sliv-icon iconName="next"></ngx-sliv-icon>
  </button>
</div>
