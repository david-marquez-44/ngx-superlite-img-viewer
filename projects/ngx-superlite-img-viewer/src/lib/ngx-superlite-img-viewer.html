<div class="superlite-viewer">

  <img class="superlite-viewer__img" [src]="currentImage()" alt="">

  <div class="superlite-viewer__controls">
    <button type="button" (click)="previous()" class="superlite-viewer__control-btn">
      <ngx-sliv-icon iconName="previous"></ngx-sliv-icon>
    </button>

    <span class="superlite-viewer__vertical-line"></span>

    <button type="button" (click)="next()" class="superlite-viewer__control-btn">
      <ngx-sliv-icon iconName="next"></ngx-sliv-icon>
    </button>

    <span class="superlite-viewer__vertical-line"></span>

    <button type="button" class="superlite-viewer__control-btn">
      <ngx-sliv-icon iconName="download"></ngx-sliv-icon>
    </button>

    <span class="superlite-viewer__vertical-line"></span>

    <button type="button" (click)="onClosed()" class="superlite-viewer__control-btn">
      <ngx-sliv-icon iconName="close"></ngx-sliv-icon>
    </button>
  </div>

</div>
